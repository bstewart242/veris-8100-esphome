name: Bug report
description: Report a reproducible problem with the configuration or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and settings
      description: Include the meter model, service type, Modbus address, and DIP-switch settings.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and private site information before pasting logs.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Checks
      options:
        - label: I removed secrets and private site details.
          required: true
